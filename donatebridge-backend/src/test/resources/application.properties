spring.application.name=donatebridge-backend

spring.datasource.url=jdbc:h2:mem:donatebridge;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true

jwt.secret=DonateBridgeSuperSecretKeyForJwtAuthentication2026SecureKey
jwt.expiration=86400000

cloudinary.cloud-name=test-cloud
cloudinary.api-key=1234567890
cloudinary.api-secret=test-secret
